name: Safety and logic tests
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q actions.py bridge.py host.py mcp_server.py screens.py windows.py
  windows-dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -c "import host, mcp_server; print('Python modules import OK')"
